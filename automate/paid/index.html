<script>
(function () {
  'use strict';
  var H = location.hostname, Q = new URLSearchParams(location.search);
  var PREVIEW = /\.vercel\.app$/.test(H) || /^(localhost|127\.0\.0\.1)$/.test(H);
  var ov = ''; try { ov = PREVIEW ? sessionStorage.getItem('au_api') || '' : ''; } catch (e) {}
  var API = (PREVIEW ? (ov || 'https://ironclad-git-automate-charts-manthan-s-projects23.vercel.app') : 'https://playbook.asendify.co') + '/api/config?au=';
  var oid = Q.get('oid') || '', token = Q.get('token') || '', tries = 0, dodo = Q.get('dodo') === '1'; // 2026-10-19: Dodo card returns
  function $(id) { return document.getElementById(id); }
  function stop(h, p, again) { $('spin').hidden = true; $('h').textContent = h; $('p').textContent = p; $('act').hidden = !again; }
  if (!/^[0-9a-f-]{36}$/.test(oid) || (!dodo && !/^[A-Z0-9]{8,30}$/.test(token))) return stop('This link is not complete', 'If you paid, your private link is in your email. Otherwise you can start again.', true);
  function go() {
    tries++;
    fetch(API + 'confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: PREVIEW ? 'include' : 'omit', body: JSON.stringify(dodo ? { oid: oid, dodo: 1, subscription_id: Q.get('subscription_id') || '', payment_id: Q.get('payment_id') || '' } : { oid: oid, token: token }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.link) { try { sessionStorage.removeItem('au_draft'); } catch (e) {} $('h').textContent = 'Payment received'; $('p').textContent = 'Opening your blueprint…'; location.replace(j.link); return; }
        if (j && j.pending) { if (tries < 8) { $('p').textContent = j.message || 'PayPal is still processing your payment…'; setTimeout(go, 5000); return; } return stop('Payment is processing', j.message || 'We email your private link as soon as PayPal confirms the payment.', false); }
        stop('We could not confirm this payment', (j && (j.message || j.error)) || 'Please try again.', true);
      })
      .catch(function () { if (tries < 4) setTimeout(go, 4000); else stop('We could not reach the server', 'If you paid, your private link is emailed to you. Please check your inbox in a few minutes.', false); });
  }
  go();
})();
</script>

<script>/* 2026-10-18: real-visit counter for the Asendify Channels dashboard (same rules as the book shops). */
(function(){try{if(sessionStorage.getItem('asd_sv')==='1')return;var q0=new URLSearchParams(location.search);

if(/(^|;\s*)asd_internal=1/.test(document.cookie))return;
if(navigator.webdriver||/bot\b|bot\/|crawl|spider|slurp|preview|headless|lighthouse|scanner|facebookexternalhit/i.test(navigator.userAgent))return;
var c=function(v){return String(v||'').toLowerCase().replace(/[^a-z0-9._-]/g,'').slice(0,60)};var src='';
if(q0.get('utm_source'))src=[c(q0.get('utm_source')),c(q0.get('utm_medium')),c(q0.get('utm_campaign'))].join('/');
if(!src&&document.referrer){var h=new URL(document.referrer).hostname.replace(/^www\./,'');if(h&&!/(^|\.)asendify\.co$/.test(h))src='ref/'+c(h);}
src=src||'direct';var path=location.pathname.replace(/[^a-zA-Z0-9._\/-]/g,'').slice(0,120)||'/';
var acts=['scroll','pointerdown','touchstart','keydown','mousemove','wheel'],sent=false,shown=0,tick;
var send=function(how){if(sent)return;sent=true;clearInterval(tick);acts.forEach(function(e){removeEventListener(e,on,true)});
try{sessionStorage.setItem('asd_sv','1')}catch(e){}
fetch('https://playbook.asendify.co/api/ref',{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({visit:src,page:path,engaged:how})}).catch(function(){})};
var on=function(){send('interact')};acts.forEach(function(e){addEventListener(e,on,{capture:true,passive:true})});
tick=setInterval(function(){if(document.visibilityState==='visible'&&(shown+=1000)>=12000)send('time')},1000);}catch(e){}})();</script>
