<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#060d0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d9488'/%3E%3Cpath d='M7 22l6-7 5 4 7-9' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css?v=1">
<title>Signing in | Chart Reader</title>
</head>
<body>
<header class="nav"><div class="wrap"><a class="logo" href="/"><span class="mark"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l4.5-5 3.5 3 6-7"/></svg></span>Chart Reader</a></div></header>
<main class="center"><div>
  <div class="spin" id="spin"></div>
  <h1 id="h">Signing you in…</h1>
  <p id="p">One moment.</p>
  <p id="act" hidden><a class="btn ghost" href="/app/">Get a new sign-in link</a></p>
</div></main>
<footer><div class="wrap"><div>Chart Reader is made by <a href="https://www.asendify.co/">Asendify</a>. Educational analysis only, not financial advice.</div><nav><a href="https://www.asendify.co/policies/">Policies</a><a href="https://www.asendify.co/">asendify.co</a></nav></div></footer>
<script src="/assets/api.js?v=1"></script>
<script>
(function () {
  'use strict';
  var t = new URLSearchParams(location.search).get('t') || '';
  try { history.replaceState(null, '', '/login/'); } catch (e) {}
  function $(id) { return document.getElementById(id); }
  function stop(h, p) { $('spin').hidden = true; $('h').textContent = h; $('p').textContent = p; $('act').hidden = false; }
  if (!/^[0-9a-f]{64}$/.test(t)) return stop('This sign-in link is not valid', 'Please request a new link.');
  CR.api('login', { t: t }).then(function (j) {
    if (j && j.session) { CR.setS(j.session); location.replace('/app/'); return; }
    stop('This link did not work', (j && (j.error || j.message)) || 'Please request a new link.');
  });
})();
</script>
<script src="https://www.asendify.co/assets/js/blossom.js?v=3" defer></script>
</body>
</html>
